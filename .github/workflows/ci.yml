name: CI
on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: cp .env.example .env
      # SQLite lives in ./data — gitignored, so the checkout has no such dir.
      - run: mkdir -p data
      - env:
          ADMIN_API_KEY: dev-admin-key-change-me
          REDIS_FAKE: "1"
        run: python -m pytest -q

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run build

  # Proves the multi-stage image works: console build (node) then the Python
  # runtime. Never pushed — build only.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t token-gateway:ci .

  # On a version tag (v1.2.3) push the image that the jobs above just proved,
  # to GitHub Container Registry. Uses the built-in GITHUB_TOKEN — no secrets
  # to configure. Runs only after test + console + docker succeed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, console, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          set -euo pipefail
          OWNER_REPO="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_REPO}/gateway"
          echo "Pushing ${IMAGE}:${GITHUB_REF_NAME} and ${IMAGE}:latest"
          docker build -t "${IMAGE}:${GITHUB_REF_NAME}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_REF_NAME}"
          docker push "${IMAGE}:latest"
