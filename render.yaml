# Render Blueprint — deploys the gateway from its Dockerfile on the free tier.
# Create it via Render Dashboard → New → Blueprint, pointing at this repo.
services:
  - name: token-gateway
    type: web
    runtime: docker
    plan: free
    # The Dockerfile EXPOSEs 8080; the app binds ${PORT:-8080}.
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod
      # No free managed Redis on Render; the gateway falls back to its
      # per-process in-memory limiter (fine with --workers 1).
      - key: REDIS_FALLBACK_INMEMORY
        value: "true"
      # Private-network connection string from the Postgres instance below.
      - key: DATABASE_URL
        fromDatabase:
          name: token-gateway-db
          property: connectionString
      # Required by the prod startup checks in gateway/main.py.
      - key: ADMIN_API_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # Upstream provider credentials: set these when prompted (Blueprint setup)
      # or later in the Render Dashboard. Empty -> proxy answers 503 with the
      # exact env var to set.
      - key: UPSTREAM_API_KEY_DEEPSEEK
        sync: false
      - key: UPSTREAM_API_KEY_QWEN
        sync: false
      - key: UPSTREAM_API_KEY_OPENAI
        sync: false
      - key: UPSTREAM_API_KEY_ANTHROPIC
        sync: false
      - key: UPSTREAM_API_KEY_BAICHUAN
        sync: false

databases:
  - name: token-gateway-db
    plan: free
